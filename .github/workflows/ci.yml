# Conflict Converge CI: bootstrap deps, generate projects, build Debug+Release,
# run the headless test suite. See AGENTS.md (Setup/Commands) for the local
# equivalents of every step below.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-2022
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python (bootstrap.py needs stdlib only)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore deps cache (third-party sources)
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: deps
          key: deps-${{ hashFiles('libs_deps.json') }}-v1

      - name: Bootstrap third-party deps
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: python bootstrap.py

      - name: Generate projects (required after any source file add/remove)
        run: .\premake5.exe vs2022

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Report MSVC toolset
        shell: powershell
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Write-Host "install: $vs"
          Get-ChildItem "$vs\VC\Tools\MSVC" -Directory | Select-Object -ExpandProperty Name

      - name: Build ${{ matrix.config }} x64 (solution is x64 only)
        run: msbuild prj/ConflictConverge.sln /p:Configuration=${{ matrix.config }} /p:Platform=x64 /v:minimal /nologo /clp:ErrorsOnly

      - name: Run tests (${{ matrix.config }}, exit 1 on failure)
        run: |
          prj/bin/${{ matrix.config }}/conflict-converge-test.exe 2>&1 | Tee-Object -FilePath test-output.txt
          exit $LASTEXITCODE
        timeout-minutes: 15

      - name: Report test warnings (soft checks, does not fail the job)
        if: always()
        shell: pwsh
        run: |
          if (Test-Path test-output.txt)
          {
            $warns = Get-Content test-output.txt | Where-Object { $_.StartsWith('WARN ') }
            if ($warns)
            {
              Write-Host "::warning title=Soft checks warned::$($warns.Count) softened check(s) failed:"
              $warns | ForEach-Object { Write-Host "::warning::$_" }
            }
          }
