// Conflict Converge per-unit-type config (JSON, parsed via protobuf-JSON).
// One file per UnitType in data/configs/<stem>.json (stems are snake_case:
// data/configs/infantry.json, antiarmor_infantry.json, ..., heavy_tank.json;
// see UnitConfigFilename). The game keeps its compiled-in defaults
// (UnitStats.cpp kTable + the ApplyBaseStats footprint rule); a file only
// overrides the entries it provides, and a missing directory degrades to
// all-defaults.
//
// armor_type/damage_type are strings holding the C++ enum names ("RUBBER",
// "KINETIC"), NOT proto enums: a proto enum would be a second source of
// truth that drifts when Unit.h gains a value, while strings keep the C++
// enums canonical with validation at load. Protobuf JSON accepts both
// camelCase and the original snake_case names on parse; output uses
// camelCase (attackPower, atlasIdlePrefix, ...).
syntax = "proto3";

package cc.unitconfig;

message UnitStatsConfig
{
    // All numerics are `optional` so "missing" (fall back to the
    // compiled-in default) stays distinguishable from an explicit zero.
    // armor_type/damage_type need no presence: "" is never a valid enum
    // name, so missing and empty both mean "use the default".
    optional float health = 1;
    string armor_type = 2;  // ArmorType enum name, e.g. "RUBBER"
    string damage_type = 3; // DamageType enum name, e.g. "KINETIC"
    optional int32 attack_power = 4;
    optional int32 attack_range = 5; // pixels (64px tiles)
    optional float cooldown_time = 6;
    optional float speed = 7;        // pixels/sec
    optional float sight_range = 8;  // pixels
}

// Collision bounds: a tile rect relative to the unit's anchor tile, in
// the same bounds/origin vocabulary as SpriteDef (left/top/right/bottom
// plus an origin point) — but in TILES, not pixels, because this is what
// the gameplay occupancy grid reserves, not what the renderer draws.
//
// The game marks every tile in [left, right) x [top, bottom) as occupied
// (OccupancyGrid), blocks pathfinding through them, and draws selection/
// placement UI from the same rect. Gameplay footprint size is therefore
// (right - left) x (bottom - top): a 1x1 infantry is bounds {0,0,1,1}, a
// 2x2 vehicle is bounds {0,0,2,2}. Bounds must satisfy
// 0 <= left < right and 0 <= top < bottom; anything else falls back to
// the compiled-in footprint for that type.
//
// Origin is the anchor tile within the footprint — the tile the unit's
// logical position snaps to. (0,0) is the top-left, which is what the
// game uses today for every type; a nonzero origin is stored, round-trips,
// and previews, but has no gameplay effect yet (anchor semantics are a
// section-5 follow-up). Example: a 2x2 footprint anchored on its bottom
// row would be bounds {0,0,2,2} with origin {0,1}.
message CollisionBounds
{
    int32 left = 1;   // tiles, inclusive
    int32 top = 2;    // tiles, inclusive
    int32 right = 3;  // tiles, exclusive
    int32 bottom = 4; // tiles, exclusive
}

message CollisionOrigin
{
    int32 x = 1; // tiles, anchor tile within the footprint
    int32 y = 2;
}

message UnitCollisionConfig
{
    CollisionBounds bounds = 1;
    CollisionOrigin origin = 2;
}

message UnitArtConfig
{
    string sprite_prefix = 1;     // replaces the UnitFile switch
    string atlas_idle_prefix = 2; // SpriteAnim name in data/configs/animations.json, or "" = flat-PNG fallback
    string atlas_walk_prefix = 3; // same, for the moving state
}

// One UnitConfig per file (no wrapping array, no "units" key); the "type"
// field must match the UnitType enum name exactly (and the file's type).
message UnitConfig
{
    string type = 1;
    UnitStatsConfig stats = 2;
    UnitCollisionConfig collision = 3;
    UnitArtConfig art = 4;
}
